services:
  server:
    build:
      context: ./server
    env_file:
      - .env
    environment:
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      VITE_API_BASE_URL: /api
    ports:
      - "5173:5173"
    depends_on:
      - server
